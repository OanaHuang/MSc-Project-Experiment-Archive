extends: ntu_cs_confirm140
data:
  minimum_temporal_history: 3
training:
  # These are the single-seed development controls from Table 2, trained on
  # the complete NTU60-CS split for the full 140-epoch confirmation budget.
  seeds: [42]
  batch_size: 128
  clip_batch_size: 128
  gradient_accumulation: 1
  num_workers: 4
  learning_rate: 0.0005
  gradient_clip: 1.0
  loss_all_frames: false
  progress_interval: 100
  phases:
    - name: head_adaptation
      start_epoch: 1
      end_epoch: 5
      train_modules: [head]
      freeze_batch_norm: true
      learning_rates: {head: 0.001}
    - name: spatial_finetune
      start_epoch: 6
      end_epoch: 140
      train_modules: [backbone, neck, head]
      freeze_batch_norm: false
      learning_rates: {backbone: 0.0001, neck: 0.0005, head: 0.0005}
  scheduler:
    kind: warmup_cosine
    warmup_epochs: 5
    min_lr: 0.000001
