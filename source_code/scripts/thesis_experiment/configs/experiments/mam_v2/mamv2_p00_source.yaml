id: mamv2_p00_source
paper_id: DEV-NTUCS2x16-S3-X2-VRESET-P20
stage: mam_v2_source
run_type: pilot
profile: pilot20
priority: conditional
model_config: s3_sp_a4
protocol: ntu_s010_mam20

# Seed-matched MPII S3 source -> NTU S010 Reset adaptation. This produces the
# Pilot spatial source; Confirm140 must use independently trained formal seeds.
initialization:
  mode: checkpoint
  source: pilot20_m_s3_u2
  match_seed: true
  load: spatial_weights_only

model:
  temporal:
    memory_kind: reset

training:
  phases:
    - name: head_adaptation
      start_epoch: 1
      end_epoch: 5
      train_modules: [head]
      freeze_batch_norm: true
      learning_rates: {head: 0.001}
    - name: spatial_finetune
      start_epoch: 6
      end_epoch: 20
      train_modules: [backbone, neck, head]
      freeze_batch_norm: false
      learning_rates: {backbone: 0.0001, neck: 0.0005, head: 0.0005}

temporal:
  video_frames: 16
  snn_updates_per_frame: 1
  input_mode: stream
  state_policy: reset
  readout: last
