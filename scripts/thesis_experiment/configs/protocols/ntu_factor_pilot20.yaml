extends: ntu_cs80
data:
  # All six controls predict exactly the same current-frame population.  Three
  # available history frames are required even when a condition consumes fewer.
  minimum_temporal_history: 3
training:
  epochs: 20
  milestone_epochs: [10, 20]
  seeds: [42]
  batch_size: 128
  clip_batch_size: 128
  gradient_accumulation: 1
  num_workers: 4
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip: 1.0
  mixed_precision: true
  deterministic_workers: true
  target_heatmap_backend: gpu
  loss_all_frames: false
  single_pass_validation: true
  firing_rate_batches: 1
  progress_interval: 100
  checkpoint_interval: 5
  phases:
    - name: head_adaptation
      start_epoch: 1
      end_epoch: 5
      train_modules: [head]
      freeze_batch_norm: true
      learning_rates: {head: 0.001}
    - name: spatial_finetune
      start_epoch: 6
      end_epoch: 20
      train_modules: [backbone, neck, head]
      freeze_batch_norm: false
      learning_rates: {backbone: 0.0001, neck: 0.0005, head: 0.0005}
  scheduler:
    kind: warmup_cosine
    warmup_epochs: 5
    min_lr: 0.000001
  augmentation:
    scale_range: [0.85, 1.15]
    rotation_degrees: 15.0
    flip_probability: 0.5
