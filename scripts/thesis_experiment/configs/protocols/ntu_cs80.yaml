dataset: ntu60_cs
data:
  frames_dir: Datasets/NTU_RGBD/frames
  frame_layout: setup_contiguous_clips
  frame_clip_subdir: contiguous_2x16
  contiguous_clip_length: 16
  clips_per_sequence: 2
  frames_per_sequence: 32
  exclude_overlapping_clips: true
  train_metadata: Datasets/NTU_RGBD/metadata/contiguous_xsub/train_split.csv
  validation_metadata: Datasets/NTU_RGBD/metadata/contiguous_xsub/val_split.csv
  test_metadata: Datasets/NTU_RGBD/metadata/contiguous_xsub/test_split.csv
  exclusion_metadata: Datasets/NTU_RGBD/metadata/contiguous_xsub/excluded_samples.csv
  image_size: 256
  heatmap_size: 64
  sigma: 2.0
  frame_stride: 1
  temporal_frame_gap: 1
  minimum_temporal_history: 0
  person_crop: true
  tube_crop: true
  bbox_expansion: 0.25
  pose_validation_mode: manifest
  pose_validation_manifest: Datasets/NTU_RGBD/metadata/preflight/ntu_pose_validation_v1.json
  runtime_cache_mode: required
  runtime_cache_root: Datasets/NTU_RGBD/runtime_cache_v1
  runtime_cache_manifest: Datasets/NTU_RGBD/runtime_cache_v1/manifest.json
  runtime_spatial_crops: true
  skeleton_cache_size: 256
  joint_mapping: ntu25_to_mpii16_v1
  split_by_sequence: true
  validation_fraction: 0.20
  validation_strategy: held_out_performers
  validation_performers: [1, 5, 14, 15]
  exclusion_policy: precomputed_single_person_nonempty_skeleton_v1
  expected_raw_sequences: 56880
  expected_quality_exclusions: 11960
  expected_usable_sequences: 44920
training:
  epochs: 80
  seeds: [42, 365198782, 2071461405]
  batch_size: 32
  clip_batch_size: 16
  num_workers: 4
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip: 1.0
  deterministic_workers: true
  target_heatmap_backend: gpu
  single_pass_validation: true
  firing_rate_batches: 1
  progress_interval: 500
  scheduler:
    kind: warmup_cosine
    warmup_epochs: 5
    min_lr: 0.000001
  augmentation:
    scale_range: [0.75, 1.25]
    rotation_degrees: 30.0
    flip_probability: 0.5
selection:
  metric: pck_hb_0_5
  mode: max
evaluation:
  main_decoder: dark
  thresholds: [0.1, 0.2, 0.5]
  pck_auc_range: [0.0, 0.5]
  sequence_weighting: equal
