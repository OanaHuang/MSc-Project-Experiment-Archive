id: confirm140_ntu_spikepose_frame
paper_id: Confirm140-NTU-SpikePose-Frame
stage: paper_framewise
model_config: s3_sp_a4
protocol: ntu_cs_mam_confirm140
initialization:
  mode: checkpoint
  source: confirm140_m_s3_u2
  match_seed: true
  load: spatial_weights_only
model:
  temporal:
    memory_kind: reset
training:
  phases:
    - name: head_adaptation
      start_epoch: 1
      end_epoch: 5
      train_modules: [head]
      freeze_batch_norm: true
      learning_rates: {head: 0.001}
    - name: spatial_finetune
      start_epoch: 6
      end_epoch: 140
      train_modules: [backbone, neck, head]
      freeze_batch_norm: false
      learning_rates: {backbone: 0.0001, neck: 0.0005, head: 0.0005}
temporal: {video_frames: 16, snn_updates_per_frame: 1, input_mode: stream, state_policy: reset, readout: last}
